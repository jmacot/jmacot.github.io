<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Herramientas COT — Nos hemos mudado</title>
<meta http-equiv="refresh" content="4;url=https://app.jmacot.com" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b); color: #f1f5f9; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
  .card { max-width: 520px; }
  .badge { display: inline-block; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #38bdf8; margin-bottom: 18px; }
  h1 { font-family: 'DM Serif Display', serif; font-size: clamp(28px, 6vw, 44px); margin-bottom: 16px; }
  p { color: #cbd5e1; line-height: 1.6; margin-bottom: 14px; font-weight: 300; }
  a.btn { display: inline-block; margin-top: 18px; padding: 12px 28px; background: linear-gradient(135deg, #38bdf8, #a78bfa); color: #0f172a; font-weight: 500; text-decoration: none; border-radius: 999px; }
  .small { font-size: 13px; color: #94a3b8; margin-top: 24px; }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Herramientas COT</span>
    <h1>Nos hemos mudado</h1>
    <p>Las herramientas clínicas se han trasladado a un nuevo espacio privado y seguro.</p>
    <p>Te estamos redirigiendo a la nueva web…</p>
    <a class="btn" href="https://app.jmacot.com">Ir a app.jmacot.com</a>
    <p class="small">Si no se te redirige automáticamente, pulsa el botón.</p>
  </div>
  <script>setTimeout(function () { location.replace('https://app.jmacot.com'); }, 4000);</script>
</body>
</html>
