<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview · Login con órbitas</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e8edf4;
      --surface: #ffffff;
      --border: #e2e8f0;
      --accent: #1a3a5c;
      --accent-hover: #14304f;
      --ink: #0f172a;
      --ink-muted: #64748b;
      --red: #dc2626;
      --red-light: #fee2e2;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
      --shadow-hover: 0 25px 50px -12px rgb(0 0 0 / 0.12);
      --radius-lg: 16px;
    }
    [data-theme="dark"] {
      --bg: #0f172a; --surface: #1e293b; --border: #334155;
      --ink: #f1f5f9; --ink-muted: #94a3b8;
      --accent: #93c5fd; --accent-hover: #bae0ff;
      --red: #f87171; --red-light: #3b1010;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.2);
      --shadow-hover: 0 25px 50px -12px rgb(0 0 0 / 0.3);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--ink);
      min-height: 100vh; margin: 0;
    }

    /* Layout 2 columnas */
    .login-wrap {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
      overflow: hidden;
    }
    /* En móvil: una sola capa con las órbitas de fondo y el card flotando encima */
    @media (max-width: 960px) {
      .login-wrap {
        display: block;
        position: relative;
        min-height: 100vh;
      }
      .orbit-side {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      /* Escalar las órbitas para que quepan en viewport pequeño */
      .orbit-bg { transform: scale(0.65); }
      .orbit-title {
        font-size: clamp(2rem, 10vw, 3.2rem);
        opacity: 0.55;
      }
      .form-side {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        background: transparent;
        box-shadow: none;
        padding: 24px 20px;
      }
      .form-side::before { display: none; }
      /* Card recupera un contenedor sutil con blur para legibilidad sobre las órbitas */
      .login-container {
        max-width: 380px;
        background: rgba(255, 255, 255, 0.88);
        -webkit-backdrop-filter: blur(14px);
                backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 20px;
        padding: 28px 24px;
        box-shadow: 0 20px 50px -20px rgba(15, 23, 42, 0.25);
      }
      [data-theme="dark"] .login-container {
        background: rgba(30, 41, 59, 0.85);
        border-color: rgba(148, 163, 184, 0.15);
      }
      /* Header del card más compacto en móvil */
      .login-header { padding-bottom: 16px; }
      .login-header .icon { width: 44px; height: 44px; margin-bottom: 14px; }
      .login-header .icon svg { width: 20px; height: 20px; }
      .login-header p { font-size: 14px; }
      .sparkle-line { margin-top: 16px; }
    }

    /* Columna izquierda: órbitas */
    .orbit-side {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      /* Más tintado para distinguirse del panel derecho blanco (visible en Windows) */
      background: linear-gradient(180deg, #dbe4f0 0%, #c7d3e4 100%);
    }
    [data-theme="dark"] .orbit-side {
      background: linear-gradient(180deg, #0c1424 0%, #152036 100%);
    }

    /* Columna derecha: form. Fondo blanco para contraste claro con el panel izquierdo */
    .form-side {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px; background: var(--surface);
      box-shadow: -8px 0 24px -8px rgba(15, 23, 42, 0.10);
    }
    [data-theme="dark"] .form-side {
      background: var(--surface);
      box-shadow: -8px 0 24px -8px rgba(0, 0, 0, 0.4);
    }
    /* Línea sky→violet en la frontera entre columnas (como el accent del landing) */
    .form-side::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 1px;
      background: linear-gradient(180deg, transparent 0%, #38bdf8 30%, #a78bfa 70%, transparent 100%);
      opacity: 0.5;
      pointer-events: none;
    }

    .orbit-bg {
      position: absolute; inset: 0; z-index: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; overflow: hidden;
    }
    .ripple {
      position: absolute; inset: 0;
      -webkit-mask-image: linear-gradient(to bottom, black, transparent);
              mask-image: linear-gradient(to bottom, black, transparent);
    }
    .ripple span {
      position: absolute; top: 50%; left: 50%;
      border-radius: 50%;
      border: 1px solid rgba(15, 23, 42, 0.15);
      background: rgba(15, 23, 42, 0.04);
      transform: translate(-50%, -50%);
      animation: ripple 2s ease infinite;
    }
    [data-theme="dark"] .ripple span {
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.04);
    }
    @keyframes ripple {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-50%, -50%) scale(0.9); }
    }

    .orbit-ring {
      position: absolute; top: 50%; left: 50%;
      border-radius: 50%;
      border: 1px dashed rgba(15, 23, 42, 0.08);
      transform: translate(-50%, -50%);
    }
    [data-theme="dark"] .orbit-ring { border-color: rgba(255,255,255,0.08); }

    .orbit {
      position: absolute; top: 50%; left: 50%;
      width: 0; height: 0;
      animation: orbit var(--duration, 20s) linear infinite;
      animation-delay: var(--delay, 0s);
    }
    .orbit.reverse { animation-direction: reverse; }
    .orbit .icon {
      position: absolute;
      top: calc(var(--radius) * -1px);
      left: 0;
      width: var(--size, 44px);
      height: var(--size, 44px);
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      animation: counter-orbit var(--duration, 20s) linear infinite;
      animation-delay: var(--delay, 0s);
    }
    .orbit.reverse .icon { animation-direction: reverse; }
    .orbit .icon svg { width: 55%; height: 55%; }

    /* Título central detrás de las órbitas (como en la prueba) */
    .orbit-title {
      position: relative;
      z-index: 1;
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      line-height: 1;
      text-align: center;
      background: linear-gradient(180deg, var(--ink) 0%, rgba(148,163,184,0.3) 100%);
      -webkit-background-clip: text;
              background-clip: text;
      -webkit-text-fill-color: transparent;
      pointer-events: none;
      padding: 0 20px;
      margin: 0;
    }
    [data-theme="dark"] .orbit-title {
      background: linear-gradient(180deg, #ffffff 0%, rgba(15,23,42,0.2) 100%);
      -webkit-background-clip: text;
              background-clip: text;
    }

    @keyframes orbit {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes counter-orbit {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(-360deg); }
    }
    @media (max-width: 1200px) {
      .orbit[data-ring="outer"], .orbit-ring[data-ring="outer"] { display: none; }
    }

    /* Card login */
    .login-container {
      width: 100%; max-width: 440px;
      animation: fadeInUp 0.6s ease-out;
    }
    /* Card plano: sin header oscuro, estilo airy coherente con el panel izquierdo */
    .login-header {
      text-align: center;
      padding: 0 0 24px;
      position: relative;
    }
    .login-header .icon {
      width: 52px; height: 52px; margin: 0 auto 20px;
      background: linear-gradient(135deg, #e0f2fe 0%, #ede9fe 100%);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px -4px rgba(56,189,248,0.25);
    }
    .login-header .icon svg {
      width: 24px; height: 24px; stroke: #38bdf8; fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    [data-theme="dark"] .login-header .icon {
      background: linear-gradient(135deg, rgba(56,189,248,0.15) 0%, rgba(167,139,250,0.15) 100%);
      border-color: rgba(147,197,253,0.25);
      box-shadow: 0 4px 12px -4px rgba(56,189,248,0.15);
    }
    [data-theme="dark"] .login-header .icon svg { stroke: #93c5fd; }
    .login-header p {
      font-size: 15px;
      color: var(--ink-muted);
      font-weight: 400;
    }
    .login-header .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 10px;
      font-size: 11px; color: var(--ink-muted);
      margin-top: 12px; font-family: 'DM Mono', monospace;
    }
    .login-header .badge .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #4caf7d; animation: pulse 2s infinite;
    }
    /* Línea accent sky→violet debajo del header — igual que el landing */
    .sparkle-line {
      position: relative; width: 100%; height: 2px;
      margin: 20px 0 0;
      background: linear-gradient(90deg, transparent 0%, #38bdf8 30%, #a78bfa 70%, transparent 100%);
      opacity: 0.5;
    }

    .login-body {
      background: transparent;
      padding: 0;
      border: none;
      box-shadow: none;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-family: 'DM Mono', monospace;
      font-size: 11px; font-weight: 500; color: var(--ink-muted);
      text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px;
    }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap input {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 48px 14px 18px;
      font-size: 16px; font-family: 'DM Sans', sans-serif;
      color: var(--ink); background: var(--surface);
      transition: border-color 0.2s, box-shadow 0.2s; outline: none;
    }
    .input-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15,23,42,0.08);
    }
    .input-wrap .toggle-password {
      position: absolute; right: 12px;
      background: none; border: none; cursor: pointer;
      padding: 4px; color: var(--ink-muted);
    }
    .input-wrap .toggle-password svg {
      width: 20px; height: 20px; stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .btn-submit {
      width: 100%; background: var(--accent); color: white;
      border: none; border-radius: 12px; padding: 14px 24px;
      font-size: 14px; font-weight: 500; font-family: 'DM Sans', sans-serif;
      cursor: pointer; letter-spacing: 0.05em;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-submit:hover {
      background: var(--accent-hover);
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }
    [data-theme="dark"] .btn-submit { color: #0f172a; }
    .login-footer { text-align: center; margin-top: 24px; }
    .login-footer span { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink-muted); }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
    }

    /* Toggle dark/light fijo */
    .theme-toggle {
      position: fixed; top: 16px; right: 16px; z-index: 100;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--ink); cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .orbit, .orbit .icon, .ripple span { animation: none !important; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">🌙</button>

  <div class="login-wrap">
    <!-- Columna izquierda: órbitas -->
    <aside class="orbit-side" aria-hidden="true">
      <div class="orbit-bg">
        <div class="ripple" id="ripple"></div>
        <div class="orbit-ring" data-ring="inner"  style="width: 240px; height: 240px;"></div>
        <div class="orbit-ring" data-ring="middle" style="width: 380px; height: 380px;"></div>
        <div class="orbit-ring" data-ring="outer"  style="width: 540px; height: 540px;"></div>
        <div id="orbits"></div>
      </div>
      <h2 class="orbit-title">Herramientas<br>COT</h2>
    </aside>

    <!-- Templates SVG -->
    <template id="svg-templates">
      <svg data-id="infecciones" viewBox="0 0 24 24" fill="none" stroke="#0369a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v5m0 8v5m-9-9h5m8 0h5"/><path d="M5.6 5.6l3.6 3.6m5.6 5.6l3.6 3.6M5.6 18.4l3.6-3.6m5.6-5.6l3.6-3.6"/></svg>
      <svg data-id="rehab" viewBox="0 0 24 24" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
      <svg data-id="knee" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      <svg data-id="cpak" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      <svg data-id="guardias" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><path d="M9 9h1"/><path d="M9 13h1"/><path d="M9 17h1"/></svg>
      <svg data-id="consent" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <svg data-id="material" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      <svg data-id="stetho" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>
      <svg data-id="cross" viewBox="0 0 24 24" fill="#ef4444"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/></svg>
      <svg data-id="bone" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 10c.7-.7 1.69 0 2.5 0a2.5 2.5 0 1 0 0-5 .5.5 0 0 1-.5-.5 2.5 2.5 0 1 0-5 0c0 .81.7 1.8 0 2.5l-7 7c-.7.7-1.69 0-2.5 0a2.5 2.5 0 0 0 0 5c.28 0 .5.22.5.5a2.5 2.5 0 1 0 5 0c0-.81-.7-1.8 0-2.5Z"/></svg>
      <svg data-id="pill" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
      <svg data-id="heart" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
    </template>

    <!-- Columna derecha: form -->
    <main class="form-side">
      <div class="login-container">
        <div class="login-header">
          <div class="icon">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              <circle cx="12" cy="16" r="1"/>
            </svg>
          </div>
          <p>Introduce tu contraseña para acceder</p>
          <div class="badge">
            <span class="dot"></span>
            jmacot.github.io
          </div>
          <div class="sparkle-line"></div>
        </div>
        <div class="login-body">
          <form id="previewForm">
            <div class="form-group">
              <label for="pwd">Contraseña</label>
              <div class="input-wrap">
                <input id="pwd" type="password" name="password" placeholder="••••••••" autofocus>
                <button type="button" class="toggle-password" id="toggleBtn" title="Mostrar">
                  <svg id="iconEye" viewBox="0 0 24 24">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg id="iconEyeOff" viewBox="0 0 24 24" style="display:none">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </button>
              </div>
            </div>
            <input type="submit" class="btn-submit" value="Entrar">
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Ripple
    (function() {
      var el = document.getElementById('ripple');
      var N = 8, base = 180, step = 70;
      for (var i = 0; i < N; i++) {
        var s = document.createElement('span');
        var size = base + i * step;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.opacity = Math.max(0.02, 0.22 - i * 0.03);
        s.style.animationDelay = (i * 0.12) + 's';
        if (i === N - 1) s.style.borderStyle = 'dashed';
        el.appendChild(s);
      }
    })();

    // Órbitas
    (function() {
      var icons = [
        { r: 120, size: 44, duration: 22, delay: 0,   reverse: false, svgId: 'infecciones', ring: 'inner' },
        { r: 120, size: 44, duration: 22, delay: -7,  reverse: false, svgId: 'rehab',       ring: 'inner' },
        { r: 120, size: 44, duration: 22, delay: -14, reverse: false, svgId: 'knee',        ring: 'inner' },
        { r: 190, size: 52, duration: 28, delay: 0,   reverse: true,  svgId: 'cpak',     ring: 'middle' },
        { r: 190, size: 52, duration: 28, delay: -7,  reverse: true,  svgId: 'guardias', ring: 'middle' },
        { r: 190, size: 52, duration: 28, delay: -14, reverse: true,  svgId: 'stetho',   ring: 'middle' },
        { r: 190, size: 52, duration: 28, delay: -21, reverse: true,  svgId: 'cross',    ring: 'middle' },
        { r: 270, size: 48, duration: 36, delay: 0,   reverse: false, svgId: 'consent',  ring: 'outer' },
        { r: 270, size: 48, duration: 36, delay: -7,  reverse: false, svgId: 'material', ring: 'outer' },
        { r: 270, size: 48, duration: 36, delay: -14, reverse: false, svgId: 'bone',     ring: 'outer' },
        { r: 270, size: 48, duration: 36, delay: -21, reverse: false, svgId: 'pill',     ring: 'outer' },
        { r: 270, size: 48, duration: 36, delay: -28, reverse: false, svgId: 'heart',    ring: 'outer' }
      ];
      var container = document.getElementById('orbits');
      var tpl = document.getElementById('svg-templates');
      icons.forEach(function(ic) {
        var wrap = document.createElement('div');
        wrap.className = 'orbit' + (ic.reverse ? ' reverse' : '');
        wrap.setAttribute('data-ring', ic.ring);
        wrap.style.setProperty('--duration', ic.duration + 's');
        wrap.style.setProperty('--delay', ic.delay + 's');
        wrap.style.setProperty('--radius', ic.r);
        wrap.style.setProperty('--size', ic.size + 'px');
        var icon = document.createElement('div');
        icon.className = 'icon';
        var svgNode = tpl.content.querySelector('svg[data-id="' + ic.svgId + '"]');
        if (svgNode) icon.appendChild(svgNode.cloneNode(true));
        wrap.appendChild(icon);
        container.appendChild(wrap);
      });
    })();

    // Toggle password
    document.getElementById('toggleBtn').addEventListener('click', function() {
      var i = document.getElementById('pwd');
      var e1 = document.getElementById('iconEye');
      var e2 = document.getElementById('iconEyeOff');
      if (i.type === 'password') { i.type = 'text'; e1.style.display='none'; e2.style.display='block'; }
      else { i.type = 'password'; e1.style.display='block'; e2.style.display='none'; }
    });

    document.getElementById('previewForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Preview visual — sin autenticación real');
    });

    // Toggle tema
    (function() {
      var btn = document.getElementById('themeToggle');
      var root = document.documentElement;
      btn.addEventListener('click', function() {
        var dark = root.getAttribute('data-theme') === 'dark';
        root.setAttribute('data-theme', dark ? 'light' : 'dark');
        btn.textContent = dark ? '🌙' : '☀️';
      });
    })();
  </script>
</body>
</html>
