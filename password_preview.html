<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso · jmacot.github.io</title>
  <meta name="theme-color" id="meta-theme" content="#020617">

  <!-- do not cache this page -->
  <meta http-equiv="cache-control" content="max-age=0">
  <meta http-equiv="cache-control" content="no-cache">
  <meta http-equiv="expires" content="0">
  <meta http-equiv="pragma" content="no-cache">

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Lamp palette (sky → violet) ── */
    :root {
      --lamp-bg: #020617;
      --lamp-text: #e2e8f0;
      --lamp-muted: #94a3b8;
      --lamp-border: rgba(148, 163, 184, .22);
      --lamp-input-bg: rgba(15, 23, 42, .55);
      --lamp-sky: #38bdf8;
      --lamp-violet: #a78bfa;
      --lamp-accent: #a78bfa;
      --red: #f87171;
      --red-bg: rgba(220, 38, 38, .18);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--lamp-bg);
      color: var(--lamp-text);
      min-height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Loading spinner ── */
    .staticrypt-spinner-container {
      height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--lamp-bg);
    }
    .staticrypt-spinner {
      display: inline-block;
      width: 32px; height: 32px;
      border: 3px solid rgba(148, 163, 184, .2);
      border-top-color: var(--lamp-sky);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Lamp stage ── */
    .lamp-stage {
      position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      width: 100%;
      overflow: hidden;
      isolation: isolate;
    }
    .lamp-fx {
      position: relative;
      display: flex;
      width: 100%;
      flex: 1 1 auto;
      align-items: center; justify-content: center;
      transform: scaleY(1.25);
      isolation: isolate;
      z-index: 0;
    }
    .lamp-cone {
      position: absolute;
      top: 50%;
      height: 14rem;
      width: 30rem;
      color: #fff;
      filter: saturate(1.05);
    }
    .lamp-cone.left  {
      right: 50%;
      --conic-pos: from 70deg at center top;
      background-image: conic-gradient(var(--conic-pos), var(--lamp-sky), transparent 50%, transparent);
    }
    .lamp-cone.right {
      left: 50%;
      --conic-pos: from 290deg at center top;
      background-image: conic-gradient(var(--conic-pos), transparent, transparent 50%, var(--lamp-violet));
    }
    .lamp-cone .mask-h, .lamp-cone .mask-v {
      position: absolute;
      background: var(--lamp-bg);
      z-index: 20;
      bottom: 0;
    }
    .lamp-cone.left  .mask-h { width: 100%; height: 10rem; left: 0;
      -webkit-mask-image: linear-gradient(to top, white, transparent);
              mask-image: linear-gradient(to top, white, transparent); }
    .lamp-cone.left  .mask-v { width: 10rem; height: 100%; left: 0;
      -webkit-mask-image: linear-gradient(to right, white, transparent);
              mask-image: linear-gradient(to right, white, transparent); }
    .lamp-cone.right .mask-h { width: 100%; height: 10rem; right: 0;
      -webkit-mask-image: linear-gradient(to top, white, transparent);
              mask-image: linear-gradient(to top, white, transparent); }
    .lamp-cone.right .mask-v { width: 10rem; height: 100%; right: 0;
      -webkit-mask-image: linear-gradient(to left, white, transparent);
              mask-image: linear-gradient(to left, white, transparent); }
    .lamp-blur-bottom {
      position: absolute; top: 50%; left: 0; right: 0;
      height: 12rem; transform: translateY(3rem) scaleX(1.5);
      background: var(--lamp-bg); filter: blur(40px);
    }
    .lamp-glass {
      position: absolute; top: 50%; left: 0; right: 0;
      height: 12rem; backdrop-filter: blur(12px); opacity: .1;
      z-index: 50;
    }
    .lamp-glow {
      position: absolute; top: 50%; left: 50%;
      width: 28rem; height: 9rem;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, #6366f1 0%, transparent 70%);
      opacity: .55;
      filter: blur(60px);
      border-radius: 9999px;
      z-index: 50;
    }
    .lamp-spot {
      position: absolute; top: 50%; left: 50%;
      width: 16rem; height: 9rem;
      transform: translate(-50%, calc(-50% - 6rem));
      background: #818cf8;
      filter: blur(40px); border-radius: 9999px;
      z-index: 30;
    }
    .lamp-line {
      position: absolute; top: 50%; left: 50%;
      width: 30rem; height: 2px;
      transform: translate(-50%, calc(-50% - 7rem));
      background: linear-gradient(90deg, var(--lamp-sky), var(--lamp-violet));
      box-shadow: 0 0 24px #7c93ff;
      z-index: 50;
    }
    .lamp-cover {
      position: absolute; top: 50%; left: 0; right: 0;
      height: 11rem; transform: translateY(-12.5rem);
      background: var(--lamp-bg);
      z-index: 40;
    }
    @keyframes lamp-grow { from { opacity:.5; width:15rem; } to { opacity:1; width:30rem; } }
    @keyframes lamp-spot { from { width: 8rem; }  to { width: 16rem; } }
    @keyframes lamp-line { from { width: 15rem; } to { width: 30rem; } }

    /* ── Contenido ── */
    .lamp-content {
      position: relative; z-index: 50;
      transform: translateY(-20rem);
      display: flex; flex-direction: column; align-items: center;
      padding: 0 1.25rem;
      width: 100%;
      max-width: 28rem;
    }
    .lamp-title {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: clamp(2.25rem, 5vw, 4.5rem);
      line-height: 1.05;
      text-align: center;
      letter-spacing: -.02em;
      margin-top: .25rem;
      background: linear-gradient(to bottom right, #e0e7ff, #818cf8 70%, #c4b5fd);
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
    }
    .lamp-title span { display: block; }
    .lamp-subtitle {
      margin-top: .75rem;
      font-size: .95rem;
      color: var(--lamp-muted);
      text-align: center;
      letter-spacing: .02em;
    }
    .lamp-form {
      margin-top: 2.25rem;
      width: 100%;
      display: flex; flex-direction: column; gap: .85rem;
    }
    .lamp-form .form-group { width: 100%; }
    .lamp-form label.field-label {
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 11px; font-weight: 500;
      color: var(--lamp-muted);
      text-transform: uppercase;
      letter-spacing: .12em;
      margin-bottom: 8px;
    }
    .lamp-field { position: relative; display: flex; align-items: center; }
    .lamp-input {
      width: 100%;
      padding: 1rem 3rem 1rem 1.15rem;
      font: inherit;
      font-size: 1rem;
      color: #f1f5f9;
      background: var(--lamp-input-bg);
      border: 1px solid var(--lamp-border);
      border-radius: 14px;
      outline: none;
      backdrop-filter: blur(10px);
      transition: border-color .2s, box-shadow .2s, background .2s;
      -webkit-appearance: none; appearance: none;
    }
    .lamp-input::placeholder { color: #64748b; }
    .lamp-input:hover { border-color: rgba(148, 163, 184, .4); }
    .lamp-input:focus {
      border-color: var(--lamp-accent);
      box-shadow: 0 0 0 4px color-mix(in oklab, var(--lamp-accent) 18%, transparent);
      background: rgba(15, 23, 42, .75);
    }
    .lamp-toggle {
      position: absolute; right: .6rem;
      width: 2.25rem; height: 2.25rem;
      display: grid; place-items: center;
      background: transparent; border: 0; cursor: pointer;
      color: var(--lamp-muted); border-radius: 8px;
      transition: color .15s, background .15s;
    }
    .lamp-toggle:hover { color: #e2e8f0; background: rgba(148, 163, 184, .08); }
    .lamp-toggle svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .lamp-submit {
      margin-top: .25rem;
      padding: 1rem 1.25rem;
      font: 500 1rem 'DM Sans', sans-serif;
      letter-spacing: .01em;
      color: #0f172a;
      background: linear-gradient(135deg, var(--lamp-sky), var(--lamp-violet));
      border: 0; border-radius: 14px; cursor: pointer;
      transition: transform .15s, box-shadow .2s, filter .2s;
      box-shadow: 0 12px 30px -8px rgba(124, 147, 255, .55);
      -webkit-appearance: none; appearance: none;
    }
    .lamp-submit:hover { filter: brightness(1.08); box-shadow: 0 14px 38px -8px rgba(124, 147, 255, .7); }
    .lamp-submit:active { transform: translateY(1px); }
    .remember-row {
      display: flex; align-items: center; gap: 8px;
      margin: .25rem 0 0;
      font-size: 13px;
      color: var(--lamp-muted);
    }
    .remember-row input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--lamp-accent);
      cursor: pointer;
    }
    .remember-row label, .remember-row span { cursor: pointer; user-select: none; }
    .error-msg {
      display: none;
      background: var(--red-bg);
      color: var(--red);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      border: 1px solid rgba(248, 113, 113, .3);
    }
    .error-msg.show { display: block; animation: title-rise .3s ease-out; }
    .lamp-meta {
      margin-top: 1.5rem;
      display: flex; align-items: center; justify-content: center;
      gap: .5rem;
      font-family: 'DM Mono', monospace;
      font-size: .7rem;
      color: var(--lamp-muted);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .lamp-meta::before, .lamp-meta::after {
      content: ""; height: 1px; width: 2.5rem;
      background: linear-gradient(to right, transparent, #334155, transparent);
    }
    .lamp-brand {
      position: fixed; top: 1.25rem; left: 1.25rem;
      display: flex; align-items: center; gap: .5rem;
      font-family: 'DM Mono', monospace;
      font-size: .7rem; letter-spacing: .15em; text-transform: uppercase;
      color: var(--lamp-muted);
      z-index: 100;
    }
    .lamp-brand-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--lamp-accent);
      box-shadow: 0 0 12px var(--lamp-accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    @keyframes title-rise {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hidden { display: none !important; }

    /* Animaciones diferidas: se disparan cuando JS añade .animate al body
       (evita que se consuman mientras #staticrypt_content está hidden). */
    body.animate .lamp-cone   { animation: lamp-grow 1.1s cubic-bezier(.4,0,.2,1) .2s both; }
    body.animate .lamp-spot   { animation: lamp-spot 1.1s cubic-bezier(.4,0,.2,1) .2s both; }
    body.animate .lamp-line   { animation: lamp-line 1.1s cubic-bezier(.4,0,.2,1) .2s both; }
    body.animate .lamp-title  { animation: title-rise .9s cubic-bezier(.4,0,.2,1) .25s both; }
    body.animate .lamp-subtitle { animation: title-rise .9s cubic-bezier(.4,0,.2,1) .35s both; }
    body.animate .lamp-form   { animation: title-rise .9s cubic-bezier(.4,0,.2,1) .45s both; }
    body.animate .lamp-meta   { animation: title-rise .9s cubic-bezier(.4,0,.2,1) .55s both; }


    /* ── Mobile ── */
    @media (max-width: 640px) {
      .lamp-fx { transform: scaleY(1); }
      .lamp-cone { width: 22rem; height: 10rem; }
      .lamp-glow { width: 18rem; height: 6rem; }
      .lamp-spot { width: 12rem !important; height: 6rem; transform: translate(-50%, calc(-50% - 4rem)) !important; }
      .lamp-line { width: 22rem; transform: translate(-50%, calc(-50% - 5rem)); }
      .lamp-cover { height: 9rem; transform: translateY(-9.5rem); }
      .lamp-blur-bottom { height: 8rem; transform: translateY(2rem) scaleX(1.5); filter: blur(30px); }
      .lamp-glass { height: 8rem; }
      .lamp-cone.left .mask-h, .lamp-cone.right .mask-h { height: 8rem; }
      .lamp-cone.left .mask-v, .lamp-cone.right .mask-v { width: 8rem; }
      .lamp-content { transform: translateY(-9rem); max-width: 22rem; }
      .lamp-title span { display: inline; }
      .lamp-title { font-size: 2.25rem; }
      .lamp-form { margin-top: 1.5rem; }
      .lamp-meta { font-size: .65rem; }
      .lamp-meta::before, .lamp-meta::after { width: 1.5rem; }
      @keyframes lamp-grow { from { opacity:.5; width:10rem; } to { opacity:1; width:22rem; } }
      @keyframes lamp-line { from { width:10rem; } to { width:22rem; } }
      @keyframes lamp-spot { from { width: 6rem; } to { width: 12rem; } }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
      .lamp-cone { width: 30rem; opacity: 1; }
      .lamp-spot { width: 16rem; }
      .lamp-line { width: 30rem; }
    }
  </style>

</head>
<body>

  <!-- Loading spinner (shown while attempting auto-decrypt) -->
  <div id="staticrypt_loading" class="staticrypt-spinner-container">
    <div class="staticrypt-spinner"></div>
  </div>

  <!-- Login form (hidden until needed) -->
  <div id="staticrypt_content" class="hidden">
    <div class="lamp-brand">
      <span class="lamp-brand-dot"></span>
      <span>jmacot · COT</span>
    </div>

    <main class="lamp-stage">
      <!-- Efecto lámpara (decorativo) -->
      <div class="lamp-fx" aria-hidden="true">
        <div class="lamp-cone left">  <div class="mask-h"></div><div class="mask-v"></div></div>
        <div class="lamp-cone right"> <div class="mask-v"></div><div class="mask-h"></div></div>
        <div class="lamp-blur-bottom"></div>
        <div class="lamp-glass"></div>
        <div class="lamp-glow"></div>
        <div class="lamp-spot"></div>
        <div class="lamp-line"></div>
        <div class="lamp-cover"></div>
      </div>

      <section class="lamp-content">
        <h1 class="lamp-title"><span>Herramientas</span> <span>COT</span></h1>
        <p class="lamp-subtitle">Acceso restringido · Introduce la contraseña</p>

        <form id="staticrypt-form" class="lamp-form" action="#" method="post" autocomplete="off">
          <div id="error-msg" class="error-msg">Contraseña incorrecta</div>

          <div class="form-group">
            <label class="field-label" for="staticrypt-password">Contraseña</label>
            <div class="lamp-field">
              <input id="staticrypt-password" class="lamp-input" type="password" name="password" autofocus>
              <button type="button" class="lamp-toggle" id="toggle-btn" title="Mostrar contraseña" aria-label="Mostrar contraseña">
                <svg id="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="icon-eye-off" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>

          <label id="staticrypt-remember-label" class="remember-row hidden">
            <input id="staticrypt-remember" type="checkbox" name="remember">
            <span>Recordarme en este dispositivo</span>
          </label>

          <input type="submit" class="lamp-submit" value="Entrar">
        </form>

      </section>
    </main>

  <script>

    // Init the staticrypt engine
    // PREVIEW: bypass StatiCrypt y muestra form directamente
    window.addEventListener('DOMContentLoaded', function() {
      document.getElementById('staticrypt_loading').classList.add('hidden');
      document.getElementById('staticrypt_content').classList.remove('hidden');
      var pw = document.getElementById('staticrypt-password');
      if (pw) pw.focus();
      requestAnimationFrame(function() { document.body.classList.add('animate'); });
    });

    var templateToggleAltShow = "Mostrar contraseña";
    var templateToggleAltHide = "Ocultar contraseña";

    // ─────────────────────────────────────────────
    //  TOGGLE PASSWORD VISIBILITY
    // ─────────────────────────────────────────────
    document.getElementById("toggle-btn").addEventListener("click", function () {
      var passwordInput = document.getElementById("staticrypt-password");
      var iconEye = document.getElementById("icon-eye");
      var iconEyeOff = document.getElementById("icon-eye-off");

      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        iconEye.style.display = "none";
        iconEyeOff.style.display = "block";
        this.title = templateToggleAltHide;
      } else {
        passwordInput.type = "password";
        iconEye.style.display = "block";
        iconEyeOff.style.display = "none";
        this.title = templateToggleAltShow;
      }
    });

    // ─────────────────────────────────────────────
    //  FORM SUBMIT
    // ─────────────────────────────────────────────
    document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
      e.preventDefault();

      var password = document.getElementById("staticrypt-password").value;
      var isRememberChecked = document.getElementById("staticrypt-remember").checked;
      var errorEl = document.getElementById("error-msg");

      // PREVIEW: simula validación (contraseña correcta = "demo")
      var isSuccessful = (document.getElementById('staticrypt-password').value === 'demo');
      var errorEl = document.getElementById("error-msg");
      if (!isSuccessful) {
        errorEl.classList.add("show");
        var input = document.getElementById("staticrypt-password");
        input.style.borderColor = "#f87171";
        input.style.boxShadow = "0 0 0 4px rgba(248,113,113,.18)";
        setTimeout(function () {
          input.style.borderColor = "";
          input.style.boxShadow = "";
          errorEl.classList.remove("show");
        }, 3000);
      }
    });

  </script>
</body>
</html>
