      --accent: #1a3a5c;
      --accent-hover: #14304f;
      --ink: #0f172a;
      --ink-muted: #64748b;
      --red: #dc2626;
      --red-light: #fee2e2;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);

      --radius: 20px;
      --radius-lg: 24px;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --ink: #f1f5f9;

      --shadow-hover: 0 25px 50px -12px rgb(0 0 0 / 0.3);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Loading spinner (shown first) ── */
    .staticrypt-spinner-container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .staticrypt-spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    /* ── Login card ── */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
    }
    [data-theme="dark"] .login-wrap {
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
    }

    /* ── GRADIENT LINE UNDER TITLE ── */
    .sparkle-line {
      position: relative;
      width: 280px;
      height: 40px;
      margin: 16px auto 0;
    }
    .sparkle-line::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #6366f1, transparent);
    }
    .sparkle-line::after {
      content: '';
      position: absolute;
      top: 0;
      left: 25%;
      right: 25%;
      height: 4px;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
      filter: blur(2px);
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      animation: fadeInUp 0.6s ease-out;
      position: relative;
      z-index: 1;
    }

    .login-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      padding: 48px 36px 40px;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .login-header::before {
      content: '';
      position: absolute;
      top: -100px;
      right: -30px;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14,165,233,0.15) 0%, transparent 70%);
      filter: blur(40px);
    }
    .login-header::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: 15%;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,92,246,0.10) 0%, transparent 70%);
      filter: blur(40px);
    }
    .login-header .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .login-header .icon svg {
      width: 28px;
      height: 28px;
      stroke: white;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .login-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.3rem, 3vw, 1.7rem);
      font-weight: 400;
      margin-bottom: 8px;
      position: relative;
    }
    .login-header p {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      position: relative;
      font-weight: 300;
    }
    .login-header .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      margin-top: 20px;
      font-family: 'DM Mono', monospace;
      position: relative;
    }
    .login-header .badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4caf7d;
      animation: pulse 2s infinite;
    }

    .login-body {
      background: var(--surface);
      padding: 32px;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      border-top: none;
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap input {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 48px 14px 18px;
      font-size: 16px;
      font-family: 'DM Sans', sans-serif;
      color: var(--ink);
      background: var(--surface);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .input-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15,23,42,0.08);
    }
    .input-wrap .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--ink-muted);
      transition: color 0.2s;
    }
    .input-wrap .toggle-password:hover {
      color: var(--accent);
    }
    .input-wrap .toggle-password svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .error-msg {
      display: none;
      background: var(--red-light);
      color: var(--red);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }
    .error-msg.show {
      display: block;
      animation: fadeInUp 0.3s ease-out;
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .remember-row label {
      font-size: 13px;
      color: var(--ink-muted);
      cursor: pointer;
      user-select: none;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      letter-spacing: 0.05em;
    }
    .btn-submit:hover {
      background: var(--accent-hover);
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }
    .btn-submit:active {
      transform: translateY(0);
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
    }
    .login-footer span {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--ink-muted);
    }

    .hidden { display: none !important; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Dark mode overrides ── */
    [data-theme="dark"] .login-header {
      background: linear-gradient(135deg, #152238 0%, #1c2f4a 50%, #213656 100%);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    [data-theme="dark"] .input-wrap input:focus {
      box-shadow: 0 0 0 3px rgba(147,197,253,0.15);
    }
    [data-theme="dark"] .btn-submit { color: #0f172a; }

    @media (max-width: 600px) {
      .login-header { padding: 36px 24px 32px; }
      .login-header::before, .login-header::after { display: none; }
      .login-body { padding: 24px 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Loading spinner (shown while attempting auto-decrypt) -->
  <div id="staticrypt_loading" class="staticrypt-spinner-container">
    <div class="staticrypt-spinner"></div>
  </div>

  <!-- Login form (hidden until needed) -->
  <div id="staticrypt_content" class="hidden">
    <div class="login-wrap">
      <div id="stars"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
      <div class="login-container">
        <div class="login-header">
          <div class="icon">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              <circle cx="12" cy="16" r="1"/>
            </svg>
          </div>
          <h1>/*[|template_title|]*/0</h1>
          <p>/*[|template_instructions|]*/0</p>
          <div class="badge">
            <span class="dot"></span>
            jmacot.github.io
          </div>
          <div class="sparkle-line"></div>
        </div>
        <div class="login-body">
          <form id="staticrypt-form" action="#" method="post">
            <div id="error-msg" class="error-msg">/*[|template_error|]*/0</div>
            <div class="form-group">
              <label for="staticrypt-password">/*[|template_placeholder|]*/0</label>
              <div class="input-wrap">
                <input id="staticrypt-password" type="password" name="password" autofocus>
                <button type="button" class="toggle-password" id="toggle-btn"
                  title="/*[|template_toggle_show|]*/0">
                  <svg id="icon-eye" viewBox="0 0 24 24">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg id="icon-eye-off" viewBox="0 0 24 24" style="display:none">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </button>
              </div>
            </div>
            <label id="staticrypt-remember-label" class="remember-row hidden">
              <input id="staticrypt-remember" type="checkbox" name="remember">
              <label for="staticrypt-remember">/*[|template_remember|]*/0</label>
            </label>
            <input type="submit" class="btn-submit" value="/*[|template_button|]*/0">
          </form>
        </div>
        <div class="login-footer">
          <span>github.com/jmacot</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ─────────────────────────────────────────────
    //  STATICRYPT ENGINE (injected at build time)
    // ─────────────────────────────────────────────
    const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
    const templateError = "/*[|template_error|]*/0",
          templateToggleAltShow = "/*[|template_toggle_show|]*/0",
          templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
          isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
          staticryptConfig = /*[|staticrypt_config|]*/ 0;

    const templateConfig = {
      rememberExpirationKey: "staticrypt_expiration",
      rememberPassphraseKey: "staticrypt_passphrase",
      replaceHtmlCallback: function(decryptedHtml) {
        localStorage.setItem('cot_auth', Date.now().toString());
        document.write(decryptedHtml);
        document.close();
      },
      clearLocalStorageCallback: null,
    };

    // Init the staticrypt engine
    const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

    // ─────────────────────────────────────────────
    //  AUTO-DECRYPT ON LOAD
    // ─────────────────────────────────────────────
    window.onload = async function () {
      const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

      if (!isSuccessful) {
        document.getElementById("staticrypt_loading").classList.add("hidden");
        document.getElementById("staticrypt_content").classList.remove("hidden");
        document.getElementById("staticrypt-password").focus();

        if (isRememberEnabled) {
          document.getElementById("staticrypt-remember-label").classList.remove("hidden");
        }
      }
    };

    // ─────────────────────────────────────────────
    //  TOGGLE PASSWORD VISIBILITY
    // ─────────────────────────────────────────────
    document.getElementById("toggle-btn").addEventListener("click", function () {
      var passwordInput = document.getElementById("staticrypt-password");
      var iconEye = document.getElementById("icon-eye");
      var iconEyeOff = document.getElementById("icon-eye-off");

      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        iconEye.style.display = "none";
        iconEyeOff.style.display = "block";
        this.title = templateToggleAltHide;
      } else {
        passwordInput.type = "password";
        iconEye.style.display = "block";
        iconEyeOff.style.display = "none";
        this.title = templateToggleAltShow;
      }
    });

    // ─────────────────────────────────────────────
    //  FORM SUBMIT
    // ─────────────────────────────────────────────
    document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
      e.preventDefault();

      var password = document.getElementById("staticrypt-password").value;
      var isRememberChecked = document.getElementById("staticrypt-remember").checked;
      var errorEl = document.getElementById("error-msg");

      const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

      if (!isSuccessful) {
        errorEl.classList.add("show");
        var input = document.getElementById("staticrypt-password");
        input.style.borderColor = "#dc2626";
        input.style.boxShadow = "0 0 0 3px rgba(220,38,38,0.10)";
        setTimeout(function () {
          input.style.borderColor = "";
          input.style.boxShadow = "";
          errorEl.classList.remove("show");
        }, 3000);
      }
    });

    // ─────────────────────────────────────────────
    //  DARK MODE (auto-detect)
    // ─────────────────────────────────────────────
    (function() {
      function applyTheme(dark) {
        var metaTheme = document.getElementById('meta-theme');
        if (dark) {
          document.documentElement.setAttribute('data-theme', 'dark');
          if (metaTheme) metaTheme.setAttribute('content', '#152238');
        } else {
          document.documentElement.removeAttribute('data-theme');
          if (metaTheme) metaTheme.setAttribute('content', '#0f172a');
        }
      }
      function getAutoTheme() {
        var hour = new Date().getHours();
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        return (hour >= 21 || hour < 7 || prefersDark) ? 'dark' : 'light';
      }
      var saved = localStorage.getItem('theme');
      var savedDate = localStorage.getItem('theme-date');
      var today = new Date().toDateString();
      if (saved && savedDate === today) {
        applyTheme(saved === 'dark');
      } else {
        applyTheme(getAutoTheme() === 'dark');
      }
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
        var s = localStorage.getItem('theme');
        var sd = localStorage.getItem('theme-date');
        if (!s || sd !== new Date().toDateString()) {
          applyTheme(getAutoTheme() === 'dark');
        }
      });
    })();
  </script>
</body>
</html>
