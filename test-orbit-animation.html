<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba · Animación Orbital con Iconos COT</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #e8edf4;
      --surface: #ffffff;
      --border: #e2e8f0;
      --ink: #0f172a;
      --ink-muted: #64748b;
      --accent: #1a3a5c;
      --sky: #38bdf8;
      --violet: #a78bfa;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
      --radius: 16px;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --ink: #f1f5f9;
      --ink-muted: #94a3b8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }
    @media (max-width: 960px) {
      .page { grid-template-columns: 1fr; }
      .orbit-side { display: none; }
    }

    /* ===== LADO ORBITAS ===== */
    .orbit-side {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, var(--bg) 0%, #dce4ef 100%);
    }
    [data-theme="dark"] .orbit-side {
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    }

    .ripple {
      position: absolute;
      inset: 0;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom, black, transparent);
              mask-image: linear-gradient(to bottom, black, transparent);
    }
    .ripple span {
      position: absolute;
      top: 50%; left: 50%;
      border-radius: 50%;
      border: 1px solid rgba(15, 23, 42, 0.15);
      background: rgba(15, 23, 42, 0.04);
      transform: translate(-50%, -50%);
      animation: ripple 2s ease infinite;
    }
    [data-theme="dark"] .ripple span {
      border-color: rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.04);
    }
    @keyframes ripple {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-50%, -50%) scale(0.9); }
    }

    .orbit-title {
      position: relative;
      z-index: 1;
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      line-height: 1;
      text-align: center;
      background: linear-gradient(180deg, var(--ink) 0%, rgba(148,163,184,0.3) 100%);
      -webkit-background-clip: text;
              background-clip: text;
      -webkit-text-fill-color: transparent;
      pointer-events: none;
      padding: 0 20px;
    }
    [data-theme="dark"] .orbit-title {
      background: linear-gradient(180deg, #ffffff 0%, rgba(15,23,42,0.2) 100%);
      -webkit-background-clip: text;
              background-clip: text;
    }

    .orbit-ring {
      position: absolute;
      top: 50%; left: 50%;
      border-radius: 50%;
      border: 1px dashed rgba(15, 23, 42, 0.08);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    [data-theme="dark"] .orbit-ring { border-color: rgba(255,255,255,0.08); }

    /* Órbita: wrap rota, hijo contra-rota */
    .orbit {
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      animation: orbit var(--duration, 20s) linear infinite;
      animation-delay: var(--delay, 0s);
    }
    .orbit.reverse { animation-direction: reverse; }
    .orbit .icon {
      position: absolute;
      top: calc(var(--radius) * -1px);
      left: 0;
      width: var(--size, 44px);
      height: var(--size, 44px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      animation: counter-orbit var(--duration, 20s) linear infinite;
      animation-delay: var(--delay, 0s);
    }
    .orbit.reverse .icon { animation-direction: reverse; }
    .orbit .icon svg { width: 55%; height: 55%; }

    @keyframes orbit {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes counter-orbit {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(-360deg); }
    }

    /* ===== FORMULARIO ===== */
    .form-side {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: var(--surface);
    }
    .form-card { width: 100%; max-width: 380px; }
    .form-card h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .form-card .sub {
      color: var(--ink-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color .2s, box-shadow .2s;
    }
    .field input:focus {
      outline: none;
      border-color: var(--sky);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.2);
    }
    .btn-primary {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #2b5a8c);
      color: white;
      font-family: inherit;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform .15s, box-shadow .2s;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -8px var(--accent); }

    .theme-toggle {
      position: fixed;
      top: 16px; right: 16px;
      z-index: 100;
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .ripple span, .orbit, .orbit .icon { animation: none !important; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">🌙</button>

  <div class="page">
    <aside class="orbit-side" aria-hidden="true">
      <div class="ripple" id="ripple"></div>

      <div class="orbit-ring" style="width: 240px; height: 240px;"></div>
      <div class="orbit-ring" style="width: 380px; height: 380px;"></div>
      <div class="orbit-ring" style="width: 540px; height: 540px;"></div>

      <h2 class="orbit-title">Herramientas<br>COT</h2>

      <div id="orbits"></div>
    </aside>

    <main class="form-side">
      <div class="form-card">
        <h1>Bienvenido</h1>
        <p class="sub">Introduce tu contraseña para acceder a las herramientas.</p>
        <form id="loginForm">
          <div class="field">
            <label for="pwd">Contraseña</label>
            <input type="password" id="pwd" placeholder="••••••••" autocomplete="current-password">
          </div>
          <button type="submit" class="btn-primary">Entrar →</button>
        </form>
      </div>
    </main>
  </div>

  <!-- Templates SVG (se clonan, evita innerHTML con contenido externo) -->
  <template id="svg-templates">
    <!-- COT: Infecciones -->
    <svg data-id="infecciones" viewBox="0 0 24 24" fill="none" stroke="#0369a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v5m0 8v5m-9-9h5m8 0h5"/><path d="M5.6 5.6l3.6 3.6m5.6 5.6l3.6 3.6M5.6 18.4l3.6-3.6m5.6-5.6l3.6-3.6"/></svg>
    <!-- COT: Rehabilitación -->
    <svg data-id="rehab" viewBox="0 0 24 24" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
    <!-- COT: Knee Align -->
    <svg data-id="knee" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
    <!-- COT: CPAK (rayo/electro) -->
    <svg data-id="cpak" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    <!-- COT: Calc. Guardias -->
    <svg data-id="guardias" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><path d="M9 9h1"/><path d="M9 13h1"/><path d="M9 17h1"/></svg>
    <!-- COT: Consentimientos -->
    <svg data-id="consent" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    <!-- COT: Material Externo -->
    <svg data-id="material" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>

    <!-- MÉDICOS -->
    <!-- Estetoscopio -->
    <svg data-id="stetho" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>
    <!-- Cruz médica -->
    <svg data-id="cross" viewBox="0 0 24 24" fill="#ef4444"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/></svg>
    <!-- Hueso -->
    <svg data-id="bone" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 10c.7-.7 1.69 0 2.5 0a2.5 2.5 0 1 0 0-5 .5.5 0 0 1-.5-.5 2.5 2.5 0 1 0-5 0c0 .81.7 1.8 0 2.5l-7 7c-.7.7-1.69 0-2.5 0a2.5 2.5 0 0 0 0 5c.28 0 .5.22.5.5a2.5 2.5 0 1 0 5 0c0-.81-.7-1.8 0-2.5Z"/></svg>
    <!-- Píldora -->
    <svg data-id="pill" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
    <!-- Corazón -->
    <svg data-id="heart" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
  </template>

  <script>
    // Construye ripple (N spans concéntricos)
    (function() {
      const container = document.getElementById('ripple');
      const N = 8;
      const base = 180;
      const step = 70;
      for (let i = 0; i < N; i++) {
        const s = document.createElement('span');
        const size = base + i * step;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.opacity = Math.max(0.02, 0.22 - i * 0.03);
        s.style.animationDelay = (i * 0.12) + 's';
        if (i === N - 1) s.style.borderStyle = 'dashed';
        container.appendChild(s);
      }
    })();

    // Órbitas
    const icons = [
      // Interior (r=120)
      { r: 120, size: 44, duration: 22, delay: 0,   reverse: false, svgId: 'infecciones', label: 'Infecciones' },
      { r: 120, size: 44, duration: 22, delay: -7,  reverse: false, svgId: 'rehab',       label: 'Rehabilitación' },
      { r: 120, size: 44, duration: 22, delay: -14, reverse: false, svgId: 'knee',        label: 'Knee Align' },
      // Media (r=190, reverse)
      { r: 190, size: 52, duration: 28, delay: 0,   reverse: true,  svgId: 'cpak',    label: 'CPAK' },
      { r: 190, size: 52, duration: 28, delay: -7,  reverse: true,  svgId: 'guardias',label: 'Calc. Guardias' },
      { r: 190, size: 52, duration: 28, delay: -14, reverse: true,  svgId: 'stetho',  label: 'Estetoscopio' },
      { r: 190, size: 52, duration: 28, delay: -21, reverse: true,  svgId: 'cross',   label: 'Cruz médica' },
      // Exterior (r=270)
      { r: 270, size: 48, duration: 36, delay: 0,   reverse: false, svgId: 'consent',  label: 'Consentimientos' },
      { r: 270, size: 48, duration: 36, delay: -7,  reverse: false, svgId: 'material', label: 'Material Externo' },
      { r: 270, size: 48, duration: 36, delay: -14, reverse: false, svgId: 'bone',     label: 'Hueso' },
      { r: 270, size: 48, duration: 36, delay: -21, reverse: false, svgId: 'pill',     label: 'Píldora' },
      { r: 270, size: 48, duration: 36, delay: -28, reverse: false, svgId: 'heart',    label: 'Corazón' },
    ];

    (function() {
      const container = document.getElementById('orbits');
      const tpl = document.getElementById('svg-templates');
      const getSvg = (id) => tpl.content.querySelector('svg[data-id="' + id + '"]');

      icons.forEach((ic) => {
        const wrap = document.createElement('div');
        wrap.className = 'orbit' + (ic.reverse ? ' reverse' : '');
        wrap.style.setProperty('--duration', ic.duration + 's');
        wrap.style.setProperty('--delay', ic.delay + 's');
        wrap.style.setProperty('--radius', ic.r);
        wrap.style.setProperty('--size', ic.size + 'px');

        const icon = document.createElement('div');
        icon.className = 'icon';
        icon.title = ic.label;

        const svgNode = getSvg(ic.svgId);
        if (svgNode) icon.appendChild(svgNode.cloneNode(true));

        wrap.appendChild(icon);
        container.appendChild(wrap);
      });
    })();

    // Demo submit
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Demo visual — sin autenticación real');
    });

    // Toggle tema
    (function() {
      const btn = document.getElementById('themeToggle');
      const root = document.documentElement;
      btn.addEventListener('click', () => {
        const dark = root.getAttribute('data-theme') === 'dark';
        root.setAttribute('data-theme', dark ? 'light' : 'dark');
        btn.textContent = dark ? '🌙' : '☀️';
      });
    })();
  </script>
</body>
</html>
